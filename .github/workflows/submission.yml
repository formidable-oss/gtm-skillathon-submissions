name: Process submission

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write
  contents: write

env:
  SKILLATHON_OPEN_AT: ${{ vars.SKILLATHON_OPEN_AT }}
  SKILLATHON_CLOSE_AT: ${{ vars.SKILLATHON_CLOSE_AT }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process the submission
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/process-submission.mjs
      - name: Rebuild and commit the board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skillathon-bot"
          git config user.email "skillathon-bot@users.noreply.github.com"
          # Rebuild from live GitHub state on top of the latest main before every push attempt,
          # so a slow run can never overwrite a newer board.
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/build-board.mjs
            git add board.json BOARD.md docs/board.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Update board [skip ci]"
            git push -q origin main && exit 0
            sleep $((attempt * 3))
          done
          echo "::warning::board push failed after retries; the next run will regenerate it"
