<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM Skillathon — submissions</title>
<style>
  :root { --bg:#0b0c10; --fg:#f2f2f2; --muted:#8b949e; --yellow:#ffd23f; --green:#3fb950; --red:#f85149; --blue:#58a6ff; --line:#21262d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display:flex; align-items:baseline; justify-content:space-between; padding:28px 40px 12px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:28px; letter-spacing:.08em; text-transform:uppercase; }
  h1 b { color:var(--yellow); }
  #clock { text-align:right; }
  #phase { color:var(--muted); font-size:14px; letter-spacing:.1em; text-transform:uppercase; }
  #countdown { font-size:56px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  #countdown.closed { color:var(--red); }
  #countdown.soon { color:var(--yellow); }
  .stats { display:flex; gap:40px; padding:18px 40px; border-bottom:1px solid var(--line); }
  .stat { display:flex; flex-direction:column; }
  .stat span { font-size:12px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
  .stat strong { font-size:32px; line-height:1.1; }
  .stat.accepted strong { color:var(--green); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 40px 10px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:500; }
  td:first-child, th:first-child { padding-left:40px; }
  td.team { font-weight:700; }
  td.status { width:1%; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  .pill.accepted { background:rgba(63,185,80,.15); color:var(--green); }
  .pill.rejected { background:rgba(248,81,73,.15); color:var(--red); }
  .pill.dry-run { background:rgba(88,166,255,.15); color:var(--blue); }
  .pill.late { background:rgba(139,148,158,.15); color:var(--muted); }
  .muted { color:var(--muted); }
  footer { padding:16px 40px; color:var(--muted); font-size:13px; }
  a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>GTM <b>Skillathon</b> · submissions</h1>
  <div id="clock"><div id="phase">…</div><div id="countdown">--:--:--</div></div>
</header>
<div class="stats">
  <div class="stat accepted"><span>Accepted</span><strong id="n-accepted">0</strong></div>
  <div class="stat"><span>Need a fix</span><strong id="n-rejected">0</strong></div>
  <div class="stat"><span>Dry runs</span><strong id="n-dry">0</strong></div>
  <div class="stat"><span>Late</span><strong id="n-late">0</strong></div>
</div>
<table>
  <thead><tr><th>Status</th><th>Team</th><th>Track</th><th>Submitted</th><th>Commit</th><th>Tries</th></tr></thead>
  <tbody id="rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
</table>
<footer>Submit via <a href="https://github.com/formidable-oss/gtm-skillathon-submissions/issues/new/choose">a submission issue</a> or <code>$skillathon-submit</code>. Latest accepted submission per repository counts. Updated <span id="updated">—</span>.</footer>
<script>
  let OPEN_AT = Date.parse("2026-08-28T15:00:00Z");
  let CLOSE_AT = Date.parse("2026-08-28T17:30:00Z");
  const TZ = "Europe/Bucharest";
  const pad = (n) => String(n).padStart(2, "0");
  const hms = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
  const local = (iso) => new Date(iso).toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit" });

  function tick() {
    const now = Date.now();
    const cd = document.getElementById("countdown"), ph = document.getElementById("phase");
    cd.className = "";
    if (now < OPEN_AT) { ph.textContent = "Submissions open in"; cd.textContent = hms(OPEN_AT - now); }
    else if (now < CLOSE_AT) { ph.textContent = "Submissions close in"; cd.textContent = hms(CLOSE_AT - now); if (CLOSE_AT - now < 15 * 60 * 1000) cd.className = "soon"; }
    else { ph.textContent = "Submissions"; cd.textContent = "CLOSED"; cd.className = "closed"; }
  }

  async function load() {
    const sources = [
      `https://raw.githubusercontent.com/formidable-oss/gtm-skillathon-submissions/main/board.json?t=${Date.now()}`,
      `./board.json?t=${Date.now()}`,
    ];
    for (const url of sources) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) continue;
        render(await res.json());
        return;
      } catch {}
    }
  }

  function render(board) {
    if (board.open_at) OPEN_AT = Date.parse(board.open_at);
    if (board.close_at) CLOSE_AT = Date.parse(board.close_at);
    const c = board.counts || {};
    document.getElementById("n-accepted").textContent = c.accepted ?? 0;
    document.getElementById("n-rejected").textContent = c.rejected ?? 0;
    document.getElementById("n-dry").textContent = c["dry-run"] ?? 0;
    document.getElementById("n-late").textContent = c.late ?? 0;
    document.getElementById("updated").textContent = local(board.generated_at);
    const rows = board.submissions || [];
    const tbody = document.getElementById("rows");
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="6" class="muted">No submissions yet.</td></tr>`; return; }
    tbody.innerHTML = rows.map((r) => `
      <tr>
        <td class="status"><span class="pill ${r.status}">${r.status}</span></td>
        <td class="team">${esc(r.team)}<span class="muted"> · ${esc((r.members || []).join(", "))}</span></td>
        <td>${esc(r.track)}</td>
        <td>${local(r.submitted_at)}</td>
        <td>${r.sha ? `<a href="${r.repo_url}/tree/${r.sha}">${r.sha.slice(0, 7)}</a>` : `<span class="muted">—</span>`}</td>
        <td class="muted">${r.attempts}</td>
      </tr>`).join("");
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  tick(); setInterval(tick, 1000);
  load(); setInterval(load, 30000);
</script>
</body>
</html>
